# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: blank # the website title (if blank, full name will be used instead)
first_name: Shuai
middle_name:
last_name: Zhu
description: > # used for meta description / link previews
  [FILL IN] one-sentence description of who you are and what you research.
lang: en # the language of your site (for example: en, fr, cn, ru, etc.)
icon: 📄 # the emoji used as the favicon (alternatively, provide image name in /assets/img/)

url: https://sh-zhu.github.io # the base hostname & protocol for your site
baseurl:  # the subpath of your site, e.g. /blog/. Leave blank for root
last_updated: false # set to true if you want to display "last updated" in the footer

# -----------------------------------------------------------------------------
# Analytics
# -----------------------------------------------------------------------------

# Privacy-friendly, ~0kb analytics: create a free account at https://www.goatcounter.com/
# and set your site code below (the part before ".goatcounter.com"). Leave blank to disable.
goatcounter_id:

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      layout: post
    output: true

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

# Markdown and syntax highlight
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Includes & excludes
include: ["_pages"]
exclude:
  - bin/
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - package.json
  - package-lock.json
  - README.md
  - vendor
keep_files:
  - CNAME
  - .nojekyll

# Plug-ins
plugins:
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-minifier

sass:
  style: compressed

jekyll-minifier:
  compress_javascript: false

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:
  last_name: [Zhu]
  first_name: [Shuai, S.]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  query: "@*"
  group_by: year
  group_order: descending
